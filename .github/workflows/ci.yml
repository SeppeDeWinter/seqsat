name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --no-build: every dependency must install from a pre-built wheel.
      - name: Install
        run: uv sync --locked --no-build

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      # Fast tests only; integration tests (-m slow) need the downloaded 10x datasets.
      - name: Test
        run: uv run pytest
